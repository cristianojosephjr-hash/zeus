[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeus-simulations"
version = "0.2.0"
description = "Zeus simulation modules and web app scaffolding."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "numpy>=1.26.0,<3.0.0",
  "scipy>=1.11.0,<2.0.0",
  "numba>=0.59.0,<1.0.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.2.0"]
gpu = ["mpi4py>=3.1.0", "pycuda>=2024.1"]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
